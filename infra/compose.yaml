services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: liverse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: liverse
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liverse"]
      interval: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../.env.production
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["node", "build/api/apps/api/src/worker.js"]
    healthcheck:
      disable: true
    env_file: ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  database:
